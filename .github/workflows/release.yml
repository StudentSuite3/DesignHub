name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build and attach release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - name: Package build
        run: |
          tar --exclude=".next/cache" -czf "designhub-${{ github.event.release.tag_name }}.tar.gz" \
            .next public package.json pnpm-lock.yaml pnpm-workspace.yaml next.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: designhub-${{ github.event.release.tag_name }}
          path: designhub-${{ github.event.release.tag_name }}.tar.gz
          retention-days: 90
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "designhub-${{ github.event.release.tag_name }}.tar.gz" --clobber
